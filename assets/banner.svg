<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#6b11ff"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <circle cx="40" cy="0" r="1.5" fill="rgba(0, 242, 254, 0.15)"/>
    </pattern>
  </defs>

  <!-- Styles for Dynamic Animation & Visibility -->
  <style>
    @keyframes pulse {
      0% { r: 5px; opacity: 0.3; }
      50% { r: 9px; opacity: 0.9; }
      100% { r: 5px; opacity: 0.3; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes orbitPulse {
      0% { transform: scale(0.98); opacity: 0.6; }
      50% { transform: scale(1.02); opacity: 0.9; }
      100% { transform: scale(0.98); opacity: 0.6; }
    }

    .pulse-node-1 { animation: pulse 3s infinite ease-in-out; }
    .pulse-node-2 { animation: pulse 4s infinite ease-in-out 1s; }
    .pulse-node-3 { animation: pulse 3.5s infinite ease-in-out 0.5s; }
    .flow-line { stroke-dasharray: 8, 8; animation: dash 25s linear infinite; }
    .floating-card { animation: floatSlow 6s ease-in-out infinite; }
    .pulse-ring { transform-origin: 980px 180px; animation: orbitPulse 5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Ambient background glow behind right side illustration -->
  <circle cx="980" cy="180" r="150" fill="#00f2fe" opacity="0.08" filter="url(#soft-glow)"/>
  <circle cx="980" cy="180" r="100" fill="#7f00ff" opacity="0.12" filter="url(#soft-glow)"/>

  <!-- DYNAMIC / ANIMATED GRAPH ELEMENTS (Positioned safely on right and bottom) -->
  <g class="pulse-ring">
    <circle cx="980" cy="180" r="130" fill="none" stroke="rgba(0, 242, 254, 0.15)" stroke-width="1.5" stroke-dasharray="4, 4"/>
    <circle cx="980" cy="180" r="95" fill="none" stroke="rgba(111, 66, 193, 0.25)" stroke-width="1.5"/>
  </g>

  <!-- Animated Connection Flows -->
  <path class="flow-line" d="M 850 110 L 980 180 L 1110 130" fill="none" stroke="url(#line-grad)" stroke-width="2"/>
  <path class="flow-line" d="M 870 250 L 980 180 L 1090 240" fill="none" stroke="url(#line-grad)" stroke-width="2"/>
  <path class="flow-line" d="M 980 60 L 980 180 L 980 300" fill="none" stroke="url(#line-grad)" stroke-width="2"/>

  <!-- Identity Security Nodes -->
  <!-- Central Identity Hub -->
  <g transform="translate(980, 180)">
    <circle cx="0" cy="0" r="42" fill="url(#shield-grad)" filter="url(#neon-glow)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <!-- Keyhole / User Shield Icon -->
    <path d="M-12 -10 A 12 12 0 1 1 12 -10 A 12 12 0 0 1 -12 -10 Z M-18 16 C-18 8 -8 4 0 4 C8 4 18 8 18 16 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Node: Cloud IAM (Top Left) -->
  <g transform="translate(850, 110)" class="floating-card">
    <rect x="-35" y="-18" width="70" height="36" rx="18" fill="#151e34" stroke="#00f2fe" stroke-width="1.2" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" fill="#00f2fe" font-size="11" font-weight="700">AWS IAM</text>
    <circle cx="35" cy="0" r="5" fill="#00f2fe" class="pulse-node-1"/>
  </g>

  <!-- Node: Microsoft Entra ID (Top Right) -->
  <g transform="translate(1110, 130)" class="floating-card" style="animation-delay: -2s;">
    <rect x="-42" y="-18" width="84" height="36" rx="18" fill="#151e34" stroke="#4facfe" stroke-width="1.2" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="700">Entra ID</text>
    <circle cx="-42" cy="0" r="5" fill="#4facfe" class="pulse-node-2"/>
  </g>

  <!-- Node: NHI / Machine Tokens (Bottom Left) -->
  <g transform="translate(870, 250)" class="floating-card" style="animation-delay: -3s;">
    <rect x="-42" y="-18" width="84" height="36" rx="18" fill="#151e34" stroke="#a855f7" stroke-width="1.2" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" fill="#e9d5ff" font-size="11" font-weight="700">NHI / Bots</text>
    <circle cx="42" cy="0" r="5" fill="#a855f7" class="pulse-node-3"/>
  </g>

  <!-- Node: Okta / IdP (Bottom Right) -->
  <g transform="translate(1090, 240)" class="floating-card" style="animation-delay: -1.5s;">
    <rect x="-38" y="-18" width="76" height="36" rx="18" fill="#151e34" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="700">Okta / IdP</text>
    <circle cx="-38" cy="0" r="5" fill="#38bdf8" class="pulse-node-1"/>
  </g>

  <!-- Status / Risk Telemetry Pill on Far Right -->
  <g transform="translate(980, 52)">
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
    <circle cx="-45" cy="0" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="5" y="4" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">POSTURE: SECURE</text>
  </g>

  <!-- FOREGROUND TEXT SECTION (Left aligned, fully unobstructed) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="260" height="30" rx="15" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#00f2fe"/>
      <text x="28" y="20" fill="#00f2fe" font-size="12" font-weight="700" letter-spacing="1">CURATED IDENTITY INTELLIGENCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="148" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome <tspan fill="url(#primary-glow)">ISPM</tspan>
    </text>

    <!-- Subtitle / Focus -->
    <text x="0" y="195" font-size="20" font-weight="600" fill="#e2e8f0" letter-spacing="0">
      Identity Security Posture Management &amp; Entitlement Governance
    </text>

    <!-- Description -->
    <text x="0" y="235" font-size="14" fill="#94a3b8" font-weight="400">
      Continuous identity hygiene, CIEM entitlement analysis, NHI monitoring,
    </text>
    <text x="0" y="258" font-size="14" fill="#94a3b8" font-weight="400">
      and graph attack-path detection across AD, Entra ID, Okta &amp; Multi-Cloud.
    </text>

    <!-- Feature Pillars (Pills at bottom left) -->
    <g transform="translate(0, 290)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="55" y="17" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">🛡️ ISPM &amp; CIEM</text>

      <!-- Pill 2 -->
      <rect x="120" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="182" y="17" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">🤖 Non-Human IAM</text>

      <!-- Pill 3 -->
      <rect x="255" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="322" y="17" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">🌐 Graph Attack Paths</text>

      <!-- Pill 4 -->
      <rect x="400" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="457" y="17" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">⚡ Least Privilege</text>
    </g>
  </g>
</svg>
